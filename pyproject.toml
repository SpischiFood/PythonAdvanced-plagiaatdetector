[project]
name = "plagiaatdetector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ischi Engels", email = "ischi.engels2830@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "typer>=0.27.3",
]

[project.scripts]
plagiaatdetector = "plagiaatdetector:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
