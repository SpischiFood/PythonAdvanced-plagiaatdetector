<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plagiaatdetector</title>
    <style>
      body {
        margin: 0;
        padding: 40px 24px;
        font-family: Arial, sans-serif;
        color: #243247;
        background-color: #f3f6fa;
      }

      table {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        border-collapse: collapse;
        background-color: white;
        box-shadow: 0 4px 16px rgb(0 0 0 / 8%);
      }

      th,
      td {
        padding: 18px 24px;
        border: 1px solid #dce3ec;
        text-align: center;
      }

      th {
        background-color: #24476b;
        color: white;
        font-weight: 600;
      }

      th:first-child,
      td:first-child {
        text-align: left;
        font-weight: 600;
      }

      td:first-child {
        background-color: #edf2f8;
      }

      tr:nth-child(odd) td:not(:first-child) {
        background-color: #f8fafc;
      }

      tr:hover td {
        background-color: #e6f0fb;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th>combinatie</th>
        {% for auteur in auteurs %}
        <th>{{ auteur }}</th>
        {% endfor %}
      </tr>
      {% for auteur in auteurs[:-1] %}
      <tr>
        <td>{{ auteur }}</td>
        {% for auteur in auteurs %}
        <td>overeenkomst</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
